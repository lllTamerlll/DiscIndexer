name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Cost_Calculation_WinUI3.sln

      - name: Build
        run: dotnet build Cost_Calculation_WinUI3.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test Cost_Calculation.Core.Tests/Cost_Calculation.Core.Tests.csproj -c Release -p:Platform=x64 --no-build
